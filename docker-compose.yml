version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pool
      POSTGRES_PASSWORD: pool
      POSTGRES_DB: pool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pool"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgres://pool:pool@postgres:5432/pool?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
